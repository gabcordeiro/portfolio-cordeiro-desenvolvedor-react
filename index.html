    <meta charset="UTF-8" />

    <meta
      name="description"
      content="Gabriel Cordeiro — Desenvolvedor Full-Stack. React, TypeScript, C#/.NET, Python e Postgres; produtos em produção com demos em vídeo, jogos, simulações em VR e pesquisa publicada (ACM/IEEE)."
    />
    <meta property="og:title" content="Gabriel Cordeiro · Desenvolvedor Full-Stack" />

      property="og:description"
      content="Full-stack com React, TypeScript, .NET e Python — MatchCV, Trampa, Faro Study, jogos e mais, com demos em vídeo."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/videos/matchcv-poster.webp" />
    <meta name="theme-color" content="#0b0b0c" />
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="preload" as="image" href="/videos/matchcv-poster.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
